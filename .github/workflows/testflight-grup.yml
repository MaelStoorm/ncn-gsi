name: TestFlight grubu kur

# Bütün uygulamalarda "Ben" adlı dahili TestFlight grubunu açar, hesap sahibini ekler ve
# yeni derlemelerin otomatik gelmesini sağlar. Elle çalıştırılır (Actions › TestFlight grubu kur › Run workflow).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grup:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '9T56U9RA2U' }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || 'b5342a93-c449-4f20-bb30-9d03e0767ad6' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_IDS: >-
        com.egemen.jalon com.pati.kopek com.pati.kedi com.maelstorm.deprematlasi
        io.github.maelstoorm.metroistanbul com.afiyetolsun.oyun com.maelstoorm.teyze
    steps:
      - uses: actions/checkout@v5
      - run: |
          pip install -q cryptography
          python3 ios/ci/testflight.py 2>&1 | tee "$RUNNER_TEMP/kayit.txt"
      - name: Sonucu ios-kayit dalına yaz
        if: always()
        run: |
          cd "$RUNNER_TEMP" && mkdir k && cp kayit.txt k/ && cd k
          git init -q -b ios-kayit && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "TestFlight grubu kaydı"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-kayit
