name: Android derleme

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK lisansları
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Yükleme anahtarını hazırla (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Anahtar dosyası SHA-256: $(sha256sum "$RUNNER_TEMP/upload.jks" | cut -c1-16) boyut: $(stat -c%s "$RUNNER_TEMP/upload.jks")"
            keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$(echo -n "$KEYSTORE_PASSWORD" | tr -d '[:space:]')" 2>&1 | grep -iE "entry|alias|error|incorrect|Keystore type" || true
            echo "İmzalı sürüm derlenecek."
          else
            echo "KEYSTORE_BASE64 tanımlı değil: yalnızca test APK'sı imzalı olacak."
          fi

      - name: Derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          mkdir -p cikti
          if [ -n "$KEYSTORE_FILE" ]; then
            # İmzalı sürüm: telefona kurulacak APK + Play Store paketi (AAB)
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/*.apk cikti/NCN-GSI-Donusturucu.apk
            cp app/build/outputs/bundle/release/*.aab cikti/NCN-GSI-Donusturucu.aab
          else
            # Anahtar yoksa yine kurulabilir tek bir APK üret
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/*.apk cikti/NCN-GSI-Donusturucu.apk
          fi

      - name: Uygulamayı indir
        uses: actions/upload-artifact@v4
        with:
          name: NCN-GSI-Donusturucu
          path: cikti/

      - name: APK'yı "apk" dalına koy
        run: |
          cd cikti
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Derleme ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
